<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Gaming Website</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            transition: background-color 0.3s;
        }

        .dark-mode {
            background-color: #181818;
            color: #f4f4f4;
        }

        /* Menu Bar */
        .menu-bar {
            
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .menu-bar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .menu-bar a:hover {
            background-color: #575757;
        }

        /* Game Containers */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .dark-mode-container {
            background-color: #282828;
        }

        .game-title {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 20px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            display: none;
            transition: background-color 0.3s;
        }

        .play-button:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Control Buttons */
        .control-buttons {
            text-align: center;
            margin: 20px;
        }

        .control-buttons button {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .control-buttons button:hover {
            background-color: #575757;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        footer a {
            color: #f4f4f4;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #ddd;
        }
    </style>
</head>

<body>
 &nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>
    <!-- Game Containers -->
    <div class="game-container">
        <iframe src="//clash3d.com/embed/subwaytwo/" allowfullscreen="true"></iframe>
        <div class="game-title">Subway Runner 2</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/rocket/" allowfullscreen="true"></iframe>
        <div class="game-title">Rocket Game</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/zombie/" allowfullscreen="true"></iframe>
        <div class="game-title">Zombie Shooter</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/moon/" allowfullscreen="true"></iframe>
        <div class="game-title">Moon Mission</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/farm/" allowfullscreen="true"></iframe>
        <div class="game-title">Farm Frenzy</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/ninja/" allowfullscreen="true"></iframe>
        <div class="game-title">Ninja Adventures</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/sniper/" allowfullscreen="true"></iframe>
        <div class="game-title">Sniper Attack</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/vegas/" allowfullscreen="true"></iframe>
        <div class="game-title">Vegas Crime</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/subway/" allowfullscreen="true"></iframe>
        <div class="game-title">Subway Surfers</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/airport/" allowfullscreen="true"></iframe>
        <div class="game-title">Airport Madness</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <div class="game-container">
        <iframe src="//clash3d.com/embed/winter/" allowfullscreen="true"></iframe>
        <div class="game-title">Winter Run</div>
        <button class="play-button" onclick="startGame(this)">Play</button>
    </div>

    <!-- Control Buttons -->
    <div class="control-buttons">
        <button onclick="stopAllGames()">Stop All Games</button>
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </div>

    <!-- Footer -->
 

    <script>
        // Function to start a game
        function startGame(button) {
            stopAllGames(); // Stop other games before starting a new one
            const iframe = button.previousElementSibling;
            iframe.style.display = 'block';
            button.style.display = 'none';
        }

        // Function to stop all games
        function stopAllGames() {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                iframe.style.display = 'none';
            });

            // Show all play buttons
            const buttons = document.querySelectorAll('.play-button');
            buttons.forEach(button => {
                button.style.display = 'block';
            });
        }

        // Function to toggle dark mode
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const containers = document.querySelectorAll('.game-container');
            containers.forEach(container => {
                container.classList.toggle('dark-mode-container');
            });
        }
    </script>
</body>

</html>
