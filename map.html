<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Google Maps</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        #map {
            width: 80%; /* Set specific width */
            height: 600px; /* Set specific height */
            margin: 20px auto; /* Center the map horizontally */
            border: 2px solid #000; /* Optional border for better visibility */
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            z-index: 5; /* Ensure controls are on top */
        }

        #controls button, #controls input {
            display: block;
            margin: 5px 0;
            width: 100%;
            padding: 5px;
        }

        #infoWindowContent {
            width: 200px;
        }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDHceAccod8qcOXsg_S6bm_9t-6YksfP-c&libraries=places,drawing,geometry"></script>
    <script>
        let map;
        let markers = [];
        let drawingManager;
        let infoWindow;

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: -34.397, lng: 150.644 },
                zoom: 8,
                styles: [
                    { "featureType": "water", "stylers": [{ "color": "#0e171d" }] },
                    { "featureType": "landscape", "stylers": [{ "color": "#1e303d" }] },
                    { "featureType": "road", "stylers": [{ "color": "#1e303d" }] },
                    { "featureType": "poi.park", "stylers": [{ "color": "#1e303d" }] },
                    { "featureType": "transit", "stylers": [{ "color": "#182731" }, { "visibility": "simplified" }] },
                    { "featureType": "poi", "elementType": "labels.icon", "stylers": [{ "color": "#f0c514" }, { "visibility": "off" }] },
                    { "featureType": "poi", "elementType": "labels.text.stroke", "stylers": [{ "color": "#1e303d" }, { "visibility": "off" }] },
                    { "featureType": "transit", "elementType": "labels.text.fill", "stylers": [{ "color": "#e77e24" }, { "visibility": "off" }] },
                    { "featureType": "road", "elementType": "labels.text.fill", "stylers": [{ "color": "#94a5a6" }] },
                    { "featureType": "administrative", "elementType": "labels", "stylers": [{ "visibility": "simplified" }, { "color": "#e84c3c" }] },
                    { "featureType": "poi", "stylers": [{ "color": "#e84c3c" }, { "visibility": "off" }] }
                ]
            });

            infoWindow = new google.maps.InfoWindow();

            drawingManager = new google.maps.drawing.DrawingManager({
                drawingMode: google.maps.drawing.OverlayType.MARKER,
                drawingControl: true,
                drawingControlOptions: {
                    position: google.maps.ControlPosition.TOP_CENTER,
                    drawingModes: ['marker', 'circle', 'polygon', 'polyline', 'rectangle']
                },
                markerOptions: {
                    animation: google.maps.Animation.DROP,
                    draggable: true
                },
                circleOptions: {
                    fillColor: '#ffff00',
                    fillOpacity: 0.5,
                    strokeWeight: 1,
                    clickable: false,
                    editable: true,
                    zIndex: 1
                }
            });
            drawingManager.setMap(map);

            google.maps.event.addListener(drawingManager, 'overlaycomplete', function(event) {
                if (event.type == 'marker') {
                    let marker = event.overlay;
                    markers.push(marker);
                    google.maps.event.addListener(marker, 'click', function() {
                        toggleBounce(marker);
                        showInfoWindow(marker);
                    });
                }
            });

            map.addListener('click', function() {
                infoWindow.close();
            });
        }

        function addMarker() {
            let marker = new google.maps.Marker({
                position: map.getCenter(),
                map: map,
                animation: google.maps.Animation.DROP,
                draggable: true
            });
            markers.push(marker);
            google.maps.event.addListener(marker, 'click', function() {
                toggleBounce(marker);
                showInfoWindow(marker);
            });
        }

        function clearMarkers() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];
        }

        function setMapStyle(style) {
            map.setOptions({styles: style});
        }

        function toggleBounce(marker) {
            marker.setAnimation(marker.getAnimation() ? null : google.maps.Animation.BOUNCE);
        }

        function showInfoWindow(marker) {
            let contentString = `<div id="infoWindowContent">
                <h3>Marker Position</h3>
                <p>Latitude: ${marker.getPosition().lat()}</p>
                <p>Longitude: ${marker.getPosition().lng()}</p>
            </div>`;
            infoWindow.setContent(contentString);
            infoWindow.open(map, marker);
        }

        function searchPlaces() {
            let input = document.getElementById('place-input').value;
            let request = {
                query: input,
                fields: ['name', 'geometry']
            };

            let service = new google.maps.places.PlacesService(map);
            service.findPlaceFromQuery(request, function(results, status) {
                if (status === google.maps.places.PlacesServiceStatus.OK) {
                    map.setCenter(results[0].geometry.location);
                    let marker = new google.maps.Marker({
                        position: results[0].geometry.location,
                        map: map
                    });
                    markers.push(marker);
                    google.maps.event.addListener(marker, 'click', function() {
                        toggleBounce(marker);
                        showInfoWindow(marker);
                    });
                }
            });
        }
    </script>
</head>
&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>

        <button onclick="searchPlaces()">Search</button>
    </div>
</body>
</html>
