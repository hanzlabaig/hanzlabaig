<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google PageSpeed Insights</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
        }
         input {
            padding: 10px;
            margin: 5px 0;
            width: 95%;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .results {
            margin-top: 20px;
        }
        .result-item {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> PageSpeed Insights</h1>
        <input type="text" id="url" placeholder="Enter URL to analyze" />
        <button onclick="analyzePageSpeed()">Analyze</button>
        <div class="results" id="results"></div>
    </div>

    <script>
        async function analyzePageSpeed() {
            const apiKey = 'AIzaSyAogMfVzfEwnV175R4zHDrtAd4eY-0JfuU';
            const url = document.getElementById('url').value;
            const apiUrl = `https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encodeURIComponent(url)}&key=${apiKey}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error fetching PageSpeed Insights data:', error);
            }
        }

        function displayResults(data) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';

            if (data.lighthouseResult) {
                const categories = data.lighthouseResult.categories;
                for (const category in categories) {
                    if (categories.hasOwnProperty(category)) {
                        const score = categories[category].score * 100;
                        const resultItem = document.createElement('div');
                        resultItem.className = 'result-item';
                        resultItem.textContent = `${category}: ${score}`;
                        resultsContainer.appendChild(resultItem);
                    }
                }
            } else {
                resultsContainer.textContent = 'No results found';
            }
        }
    </script>
</body>
</html>
