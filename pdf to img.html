<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PDF to Image Converter</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .converter-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
            transition: all 0.3s ease-in-out;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        .drop-area {
            border: 2px dashed #3498db;
            padding: 30px;
            background-color: #f9f9f9;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .drop-area:hover {
            background-color: #e8f4fa;
        }

        .drop-area p {
            color: #333;
            font-size: 16px;
        }

        input[type="file"] {
            display: none;
        }

        .preview {
            margin-top: 20px;
        }

        canvas {
            display: block;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .download-btn {
            margin-top: 10px;
        }

        .download-btn a {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .download-btn a:hover {
            background-color: #0056b3;
        }

        .progress-bar {
            width: 0;
            height: 8px;
            background-color: #28a745;
            border-radius: 4px;
            margin: 15px 0;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>
    <div class="converter-container">
        <h1>Advanced PDF to Image Converter</h1>
        <div class="drop-area" id="dropArea">
            <p>Drag & Drop PDF Here or <span style="color: #3498db; cursor: pointer;" id="browseLink">Browse</span></p>
            <input type="file" id="pdfInput" accept="application/pdf">
        </div>
        <div class="preview" id="preview"></div>
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script>
        const dropArea = document.getElementById('dropArea');
        const browseLink = document.getElementById('browseLink');
        const pdfInput = document.getElementById('pdfInput');
        const previewContainer = document.getElementById('preview');
        const progressBar = document.getElementById('progressBar');

        browseLink.addEventListener('click', () => {
            pdfInput.click();
        });

        dropArea.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropArea.style.backgroundColor = "#e8f4fa";
        });

        dropArea.addEventListener('dragleave', () => {
            dropArea.style.backgroundColor = "#f9f9f9";
        });

        dropArea.addEventListener('drop', (event) => {
            event.preventDefault();
            dropArea.style.backgroundColor = "#f9f9f9";
            const file = event.dataTransfer.files[0];
            if (file && file.type === "application/pdf") {
                handlePDF(file);
            }
        });

        pdfInput.addEventListener('change', function() {
            const file = pdfInput.files[0];
            if (file && file.type === "application/pdf") {
                handlePDF(file);
            }
        });

        function handlePDF(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const pdfData = new Uint8Array(event.target.result);
                const loadingTask = pdfjsLib.getDocument({data: pdfData});
                loadingTask.promise.then(function(pdf) {
                    const totalPages = pdf.numPages;
                    let processedPages = 0;

                    progressBar.style.width = '0%';
                    progressBar.style.display = 'block';

                    for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
                        pdf.getPage(pageNumber).then(function(page) {
                            const viewport = page.getViewport({scale: 2});
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;

                            const renderContext = {
                                canvasContext: context,
                                viewport: viewport
                            };

                            page.render(renderContext).promise.then(function() {
                                const imgURL = canvas.toDataURL();
                                const imgElement = document.createElement('img');
                                imgElement.src = imgURL;
                                previewContainer.appendChild(canvas);

                                const downloadLink = document.createElement('a');
                                downloadLink.href = imgURL;
                                downloadLink.download = `page_${pageNumber}.png`;
                                downloadLink.textContent = `Download Page ${pageNumber}`;
                                downloadLink.classList.add('download-btn');
                                const downloadBtnDiv = document.createElement('div');
                                downloadBtnDiv.classList.add('download-btn');
                                downloadBtnDiv.appendChild(downloadLink);
                                previewContainer.appendChild(downloadBtnDiv);

                                processedPages++;
                                const progress = (processedPages / totalPages) * 100;
                                progressBar.style.width = progress + '%';
                            });
                        });
                    }
                }, function(error) {
                    console.error('Error loading PDF:', error);
                });
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
