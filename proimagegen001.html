<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional AI Image Generator</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            padding: 30px;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        h1 {
            font-size: 3.5em;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
        }

        #prompt-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        #prompt-container input {
            flex: 1;
            padding: 15px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: background 0.3s ease;
        }

        #prompt-container input:focus {
            background: rgba(255, 255, 255, 0.2);
        }

        #fetch-button {
            padding: 15px 25px;
            background-color: #6a11cb;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #fetch-button:hover {
            background-color: #8b14f2;
        }

        #image-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 20px;
            margin-top: 20px;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        .image-box {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: scale(0);
            animation: scaleUp 0.6s forwards;
        }

        .image-box img {
            width: 100%;
            height: auto;
            transition: transform 0.5s ease;
        }

        .image-box:hover img {
            transform: scale(1.15);
        }

        .download-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease, background-color 0.3s ease;
        }

        .image-box:hover .download-btn {
            opacity: 1;
        }

        .download-btn:hover {
            background-color: #8b14f2;
        }

        #loader {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #6a11cb;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 2s linear infinite;
            margin: 50px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            color: #ff4c4c;
            font-size: 1.4em;
            margin-top: 20px;
        }

        .toolbox {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .toolbox button {
            padding: 12px 18px;
            background-color: #2575fc;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .toolbox button:hover {
            background-color: #3598fd;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            text-align: center;
            font-size: 1em;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.3);
        }

        footer a {
            color: #6a11cb;
            text-decoration: none;
        }

        footer a:hover {
            color: #8b14f2;
            text-decoration: underline;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes scaleUp {
            to {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    &nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>&nbsp<br>

    <div class="container">
        <div id="prompt-container">
            <input type="text" id="image-prompt" placeholder="Enter image type or style (e.g., 'sunset', 'modern art')">
            <button id="fetch-button">Search</button>
        </div>

        <div class="toolbox">
            <button id="refresh-button">Refresh</button>
            <button id="clear-button">Clear Images</button>
        </div>

        <div id="image-container"></div>
        <div id="loader" class="loader" style="display: none;"></div>
        <div id="error-message" class="error-message" style="display: none;"></div>
    </div>

    <script>
        const unsplashAccessKey = '06nGr1LeWd0phKPibemD-zTrVJTECmAu4-29_xId7W8';
        const fetchButton = document.getElementById('fetch-button');
        const refreshButton = document.getElementById('refresh-button');
        const clearButton = document.getElementById('clear-button');
        const imageContainer = document.getElementById('image-container');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');
        const imagePrompt = document.getElementById('image-prompt');

        fetchButton.addEventListener('click', () => {
            fetchImages();
        });

        refreshButton.addEventListener('click', () => {
            imagePrompt.value = '';
            fetchImages();
        });

        clearButton.addEventListener('click', () => {
            imageContainer.innerHTML = '';
        });

        function fetchImages() {
            const query = imagePrompt.value.trim();
            if (!query) {
                showErrorMessage('Please enter a valid image type or style.');
                return;
            }

            imageContainer.innerHTML = ''; // Clear any existing images
            loader.style.display = 'block'; // Show loader
            errorMessage.style.display = 'none'; // Hide error message

            fetch(`https://api.unsplash.com/search/photos?query=${query}&per_page=30&client_id=${unsplashAccessKey}`)
                .then(response => response.json())
                .then(data => {
                    if (data.results.length === 0) {
                        showErrorMessage('No images found for your search.');
                        loader.style.display = 'none';
                        return;
                    }

                    data.results.forEach(photo => {
                        const imageBox = document.createElement('div');
                        imageBox.className = 'image-box';
                        imageBox.innerHTML = `
                            <img src="${photo.urls.small}" alt="${photo.alt_description}">
                            <button class="download-btn" onclick="downloadImage('${photo.urls.full}')">Download</button>
                        `;
                        imageContainer.appendChild(imageBox);
                    });

                    loader.style.display = 'none'; // Hide loader
                })
                .catch(error => {
                    console.error('Error fetching images:', error);
                    showErrorMessage('Error fetching images. Please try again later.');
                    loader.style.display = 'none';
                });
        }

        function downloadImage(url) {
            fetch(url)
                .then(response => response.blob())
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'image.jpg';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    alert('Your image has been downloaded!');
                })
                .catch(() => alert('Failed to download image.'));
        }

        function showErrorMessage(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
    </script>

</body>

</html>
